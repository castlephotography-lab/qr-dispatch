<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111310">
    <meta name="description" content="Fast, offline warehouse QR and Code 128 print sheet generator.">
    <title>QR Dispatch</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./print.css" media="print">
    <script defer src="./vendor/qrcode.js"></script>
    <script defer src="./vendor/qrcode_UTF8.js"></script>
    <script defer src="./vendor/bwip-js-min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-lockup" aria-label="QR Dispatch">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <div>
            <h1>QR Dispatch</h1>
            <p>Outbound appointment sheets</p>
          </div>
        </div>
        <div class="system-state" id="system-state" aria-live="polite">
          <span class="status-dot"></span>
          <span id="system-state-text">Starting…</span>
        </div>
      </header>

      <main>
        <section class="schedule-panel" aria-labelledby="schedule-heading">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Today’s sheet</p>
              <h2 id="schedule-heading">Scheduled appointments</h2>
            </div>
            <p class="entry-count"><strong id="entry-count">0</strong> entries</p>
          </div>

          <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
          <div id="schedule-grid" class="schedule-grid" aria-label="Appointment entry fields"></div>

          <details class="workins" id="workins">
            <summary tabindex="-1">
              <span><strong>WORK-INS</strong><small>Unscheduled appointments</small></span>
              <span class="workin-count" id="workin-count">0</span>
            </summary>
            <div class="workin-body">
              <div id="workin-list" class="workin-list"></div>
              <button class="text-button" id="add-workin" type="button" tabindex="-1">+ Add work-in</button>
            </div>
          </details>
        </section>

        <section class="action-bar" aria-label="Sheet actions">
          <label class="format-control" for="format-select">
            <span>Code format</span>
            <select id="format-select" tabindex="-1">
              <option value="qr">QR Code</option>
              <option value="code128">Code 128</option>
              <option value="both">QR + Code 128</option>
            </select>
          </label>
          <div class="save-state" id="save-state" aria-live="polite">Saved locally</div>
          <button class="clear-button" id="clear-button" type="button" tabindex="-1">New day / Clear</button>
          <button class="print-button" id="print-button" type="button" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4a2 2 0 0 1-2-2v-4a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v4a2 2 0 0 1-2 2h-3M7 14h10v7H7z"/></svg>
            Print sheet
          </button>
        </section>
      </main>
    </div>

    <div id="print-root" aria-hidden="true"></div>
  </body>
</html>
